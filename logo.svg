<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиент для фонового круга -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#007AFF;stop-opacity:0.1" />
    </linearGradient>
    
    <!-- Градиент для основной иконки sparkles -->
    <linearGradient id="sparklesGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#007AFF;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#007AFF;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Фоновый круг -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGradient)"/>
  
  <!-- Основная иконка sparkles (центральная) -->
  <g transform="translate(256, 256)">
    <!-- Основные лучи -->
    <path d="M 0,-80 L -8,-65 L 8,-65 Z" fill="url(#sparklesGradient)" opacity="0.9"/>
    <path d="M 0,80 L -8,65 L 8,65 Z" fill="url(#sparklesGradient)" opacity="0.9"/>
    <path d="M -80,0 L -65,-8 L -65,8 Z" fill="url(#sparklesGradient)" opacity="0.9"/>
    <path d="M 80,0 L 65,-8 L 65,8 Z" fill="url(#sparklesGradient)" opacity="0.9"/>
    
    <!-- Диагональные лучи -->
    <path d="M -56,-56 L -48,-44 L -44,-48 Z" fill="url(#sparklesGradient)" opacity="0.85"/>
    <path d="M 56,-56 L 48,-44 L 44,-48 Z" fill="url(#sparklesGradient)" opacity="0.85"/>
    <path d="M -56,56 L -48,44 L -44,48 Z" fill="url(#sparklesGradient)" opacity="0.85"/>
    <path d="M 56,56 L 48,44 L 44,48 Z" fill="url(#sparklesGradient)" opacity="0.85"/>
    
    <!-- Центральная звездочка -->
    <circle cx="0" cy="0" r="12" fill="url(#sparklesGradient)"/>
  </g>
  
  <!-- Маленькие sparkles вокруг (3 штуки) -->
  <g transform="translate(256, 256)">
    <!-- Sparkle 1 (верх) -->
    <g transform="translate(0, -160)">
      <path d="M 0,-20 L -4,-12 L 4,-12 Z" fill="#007AFF" opacity="0.6"/>
      <path d="M 0,20 L -4,12 L 4,12 Z" fill="#007AFF" opacity="0.6"/>
      <path d="M -20,0 L -12,-4 L -12,4 Z" fill="#007AFF" opacity="0.6"/>
      <path d="M 20,0 L 12,-4 L 12,4 Z" fill="#007AFF" opacity="0.6"/>
      <circle cx="0" cy="0" r="4" fill="#007AFF" opacity="0.6"/>
    </g>
    
    <!-- Sparkle 2 (низ-лево) -->
    <g transform="translate(-140, 80)">
      <path d="M 0,-20 L -4,-12 L 4,-12 Z" fill="#007AFF" opacity="0.6"/>
      <path d="M 0,20 L -4,12 L 4,12 Z" fill="#007AFF" opacity="0.6"/>
      <path d="M -20,0 L -12,-4 L -12,4 Z" fill="#007AFF" opacity="0.6"/>
      <path d="M 20,0 L 12,-4 L 12,4 Z" fill="#007AFF" opacity="0.6"/>
      <circle cx="0" cy="0" r="4" fill="#007AFF" opacity="0.6"/>
    </g>
    
    <!-- Sparkle 3 (низ-право) -->
    <g transform="translate(140, 80)">
      <path d="M 0,-20 L -4,-12 L 4,-12 Z" fill="#007AFF" opacity="0.6"/>
      <path d="M 0,20 L -4,12 L 4,12 Z" fill="#007AFF" opacity="0.6"/>
      <path d="M -20,0 L -12,-4 L -12,4 Z" fill="#007AFF" opacity="0.6"/>
      <path d="M 20,0 L 12,-4 L 12,4 Z" fill="#007AFF" opacity="0.6"/>
      <circle cx="0" cy="0" r="4" fill="#007AFF" opacity="0.6"/>
    </g>
  </g>
</svg>

