<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиент для фонового круга -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#007AFF;stop-opacity:0.1" />
    </linearGradient>
    
    <!-- Градиент для основной иконки sparkles -->
    <linearGradient id="sparklesGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#007AFF;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#007AFF;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Фоновый круг -->
  <circle cx="90" cy="90" r="85" fill="url(#bgGradient)"/>
  
  <!-- Основная иконка sparkles (центральная) -->
  <g transform="translate(90, 90)">
    <!-- Основные лучи -->
    <path d="M 0,-50 L -5,-40 L 5,-40 Z" fill="url(#sparklesGradient)" opacity="0.9"/>
    <path d="M 0,50 L -5,40 L 5,40 Z" fill="url(#sparklesGradient)" opacity="0.9"/>
    <path d="M -50,0 L -40,-5 L -40,5 Z" fill="url(#sparklesGradient)" opacity="0.9"/>
    <path d="M 50,0 L 40,-5 L 40,5 Z" fill="url(#sparklesGradient)" opacity="0.9"/>
    
    <!-- Диагональные лучи -->
    <path d="M -35,-35 L -30,-27 L -27,-30 Z" fill="url(#sparklesGradient)" opacity="0.85"/>
    <path d="M 35,-35 L 30,-27 L 27,-30 Z" fill="url(#sparklesGradient)" opacity="0.85"/>
    <path d="M -35,35 L -30,27 L -27,30 Z" fill="url(#sparklesGradient)" opacity="0.85"/>
    <path d="M 35,35 L 30,27 L 27,30 Z" fill="url(#sparklesGradient)" opacity="0.85"/>
    
    <!-- Центральная звездочка -->
    <circle cx="0" cy="0" r="8" fill="url(#sparklesGradient)"/>
  </g>
  
  <!-- Маленькие sparkles вокруг (3 штуки) -->
  <g transform="translate(90, 90)">
    <!-- Sparkle 1 (верх) -->
    <g transform="translate(0, -55)">
      <path d="M 0,-12 L -3,-7 L 3,-7 Z" fill="#007AFF" opacity="0.6"/>
      <path d="M 0,12 L -3,7 L 3,7 Z" fill="#007AFF" opacity="0.6"/>
      <path d="M -12,0 L -7,-3 L -7,3 Z" fill="#007AFF" opacity="0.6"/>
      <path d="M 12,0 L 7,-3 L 7,3 Z" fill="#007AFF" opacity="0.6"/>
      <circle cx="0" cy="0" r="2.5" fill="#007AFF" opacity="0.6"/>
    </g>
    
    <!-- Sparkle 2 (низ-лево) -->
    <g transform="translate(-48, 28)">
      <path d="M 0,-12 L -3,-7 L 3,-7 Z" fill="#007AFF" opacity="0.6"/>
      <path d="M 0,12 L -3,7 L 3,7 Z" fill="#007AFF" opacity="0.6"/>
      <path d="M -12,0 L -7,-3 L -7,3 Z" fill="#007AFF" opacity="0.6"/>
      <path d="M 12,0 L 7,-3 L 7,3 Z" fill="#007AFF" opacity="0.6"/>
      <circle cx="0" cy="0" r="2.5" fill="#007AFF" opacity="0.6"/>
    </g>
    
    <!-- Sparkle 3 (низ-право) -->
    <g transform="translate(48, 28)">
      <path d="M 0,-12 L -3,-7 L 3,-7 Z" fill="#007AFF" opacity="0.6"/>
      <path d="M 0,12 L -3,7 L 3,7 Z" fill="#007AFF" opacity="0.6"/>
      <path d="M -12,0 L -7,-3 L -7,3 Z" fill="#007AFF" opacity="0.6"/>
      <path d="M 12,0 L 7,-3 L 7,3 Z" fill="#007AFF" opacity="0.6"/>
      <circle cx="0" cy="0" r="2.5" fill="#007AFF" opacity="0.6"/>
    </g>
  </g>
</svg>

